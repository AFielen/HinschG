services:
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://drk:${DB_PASSWORD}@db:5432/hinweisgebersystem
      JWT_SECRET: ${JWT_SECRET}
      SETUP_TOKEN: ${SETUP_TOKEN}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      MAILJET_API_KEY: ${MAILJET_API_KEY}
      MAILJET_SECRET_KEY: ${MAILJET_SECRET_KEY}
      MAIL_FROM: ${MAIL_FROM}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: drk
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: hinweisgebersystem
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drk -d hinweisgebersystem"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
